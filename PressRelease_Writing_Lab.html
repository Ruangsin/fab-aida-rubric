<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Press Release Writing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7c3aed;--p2:#a855f7;--k:#ec4899;--k2:#f472b6;--ink:#2a1055;--mut:#6b5b8c;--bg:#fbf5ff;--card:rgba(255,255,255,.74);--line:rgba(124,58,237,.18);--ok:#10b981;--bad:#f43f5e;--r:22px;--sh:0 18px 50px -18px rgba(124,58,237,.35);--surf:#fff;--surf2:#fff5fb;--top:rgba(251,245,255,.72)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;line-height:1.5}
button,input,textarea{font-family:inherit;color:inherit}
/* animated background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#fbf5ff,#fff1f8 55%,#f3ecff)}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.55;animation:float 20s ease-in-out infinite}
.b1{width:46vmax;height:46vmax;background:#c4b5fd;left:-12vmax;top:-14vmax}
.b2{width:40vmax;height:40vmax;background:#f9a8d4;right:-10vmax;top:10vh;animation-delay:-7s}
.b3{width:34vmax;height:34vmax;background:#a5b4fc;left:25vw;bottom:-16vmax;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,4vmax) scale(1.12)}66%{transform:translate(-4vmax,7vmax) scale(.94)}}
.spark{position:absolute;bottom:-30px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(236,72,153,.0) 70%);opacity:0;animation:rise-up linear infinite}
@keyframes rise-up{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) scale(1.3);opacity:0}}
/* header */
#top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px clamp(12px,3vw,28px);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:var(--top);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.2px;margin-right:auto;background:linear-gradient(90deg,var(--p),var(--k),var(--p));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% center}}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;box-shadow:0 4px 14px -8px rgba(124,58,237,.5);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.score b{font-variant-numeric:tabular-nums}
.chip button{all:unset;cursor:pointer;color:var(--p);font-weight:600}
/* screens */
#app{padding:clamp(12px,3vw,28px);max-width:1280px;margin:0 auto}
.screen{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.center{min-height:78vh;display:grid;place-items:center}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(16px,2.4vw,28px)}
.hero{width:min(560px,100%);text-align:center;position:relative}
.kicker{display:inline-block;padding:4px 12px;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--k));color:#fff;font-size:12px;letter-spacing:.6px;font-weight:600;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(236,72,153,0)}0%{box-shadow:0 0 0 0 rgba(236,72,153,.45)}}
h1.title{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:16px 0 8px;font-weight:800}
.ltr{display:inline-block;opacity:0;transform:translateY(.7em) rotate(8deg);animation:ltr .7s cubic-bezier(.2,.9,.3,1.5) forwards;animation-delay:calc(var(--i)*38ms);background:linear-gradient(120deg,var(--p),var(--k));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes ltr{to{opacity:1;transform:none}}
.sub{color:var(--mut);margin:0 0 18px}
.search{position:relative;text-align:left}
.search input{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surf);font-size:16px;outline:none;transition:.25s}
.search input:focus{border-color:var(--p2);box-shadow:0 0 0 5px rgba(168,85,247,.16)}
.res{display:grid;gap:6px;margin-top:8px}
.res button{all:unset;cursor:pointer;padding:10px 14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);animation:rise .35s both;animation-delay:calc(var(--i)*40ms);transition:.2s}
.res button:hover,.res button:focus-visible{transform:translateX(6px);border-color:var(--k);background:var(--surf2)}
.res small{color:var(--mut);margin-left:8px}
.note{margin-top:16px;font-size:13px;color:var(--mut)}
.demo{margin-top:12px;padding:8px 12px;border-radius:12px;background:#fff7d6;border:1px dashed #e0b400;font-size:13px;color:#7a5b00}
/* buttons */
.btn{all:unset;cursor:pointer;padding:11px 20px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--k));box-shadow:0 10px 24px -10px rgba(236,72,153,.7);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;text-align:center}
.btn:hover{transform:translateY(-2px) scale(1.02)}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%)}
.btn:hover::after{transition:transform .7s;transform:translateX(120%)}
.btn.ghost{background:var(--surf);color:var(--p);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.big{font-size:17px;padding:14px 24px;width:100%}
/* story picker */
.ph1{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:6px 0 18px}
.ph1 h2{margin:0;font-size:clamp(22px,4vw,32px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;perspective:900px}
.story{all:unset;cursor:pointer;display:block;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:var(--sh);transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .18s ease-out,box-shadow .25s;animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);position:relative;overflow:hidden}
.story:hover{box-shadow:0 26px 50px -16px rgba(236,72,153,.5)}
.story::before{content:"";position:absolute;inset:-60% -30%;background:conic-gradient(from 0deg,transparent,rgba(236,72,153,.25),transparent 40%);opacity:0;transition:.4s;animation:spin 6s linear infinite}
.story:hover::before{opacity:1}
@keyframes spin{to{transform:rotate(1turn)}}
.story>*{position:relative}
.story .ic{font-size:44px;display:inline-block;animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--k);font-weight:700;display:block;margin-top:6px}
.story h3{margin:2px 0 2px;font-size:18px}
.story p{margin:0;color:var(--mut);font-size:14px}
.story .n{position:absolute;right:14px;top:10px;font-weight:800;font-size:28px;color:rgba(124,58,237,.12)}
.story .prog{margin-top:10px;font-size:12px;color:var(--p);font-weight:600}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(42,16,85,.38);backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;animation:pop .45s cubic-bezier(.2,1.2,.3,1) both;background:var(--surf)}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}}
.modal h3{margin:0 0 4px;font-size:22px}
.mact{display:flex;gap:10px;margin-top:16px}.mact .btn{flex:1}
/* fact sheet */
.facts{display:grid;gap:8px;margin-top:10px}
.fr{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-size:13.5px;animation:rise .5s both;animation-delay:calc(var(--i)*35ms)}
.fr b{color:var(--p);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.fr.extra{border-style:dashed;background:#f7f4ff}
.fr.extra b::after{content:" · not lead-worthy";color:var(--mut);text-transform:none;letter-spacing:0;font-weight:500}
.fr.must{border-color:var(--k);background:#fff5fb}
/* workspace */
.ws{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:18px;align-items:start}
.fs{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto}
.fs summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center;font-weight:700}
.fs summary::-webkit-details-marker{display:none}
.fs .sic{font-size:34px;animation:bob 3s ease-in-out infinite}
.fs summary i{margin-left:auto;font-style:normal;transition:.3s}
.fs[open] summary i{transform:rotate(180deg)}
.stepper{position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;scrollbar-width:thin}
.pill{all:unset;cursor:pointer;flex:0 0 auto;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;position:relative;z-index:1;transition:color .3s,transform .2s;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill:hover{transform:translateY(-2px)}
.pill.on{color:#fff}
.pill.done{border-color:var(--p2)}
.pill.perfect::after{content:"★";color:#f59e0b;margin-left:2px;animation:twinkle 1.6s infinite}
.pill.on.perfect::after{color:#fde68a}
@keyframes twinkle{50%{transform:scale(1.4) rotate(20deg)}}
.ind{position:absolute;top:6px;left:0;height:calc(100% - 18px);border-radius:99px;background:linear-gradient(135deg,var(--p),var(--k));box-shadow:0 8px 20px -8px rgba(236,72,153,.8);transition:transform .45s cubic-bezier(.3,1.2,.4,1),width .45s cubic-bezier(.3,1.2,.4,1);z-index:0}
.meter{height:8px;border-radius:99px;background:rgba(124,58,237,.12);overflow:hidden;margin:2px 0 16px;position:relative}
.meter b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--k),#f59e0b);background-size:200% 100%;animation:shine 3s linear infinite;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.part{animation:inr .5s cubic-bezier(.2,.8,.2,1) both}
.part.in-l{animation-name:inl}
@keyframes inr{from{opacity:0;transform:translateX(50px)}}
@keyframes inl{from{opacity:0;transform:translateX(-50px)}}
.phd{display:flex;gap:14px;align-items:center}
.pic{font-size:38px;width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#f3e8ff,#ffe4f3);animation:bob 3s ease-in-out infinite}
.pn{font-size:12px;letter-spacing:1px;color:var(--k);font-weight:700}
.phd h2{margin:0;font-size:clamp(20px,3.4vw,28px);line-height:1.15}
.phd h2 small{display:block;font-size:14px;color:var(--mut);font-weight:500}
.ring{margin-left:auto;position:relative;width:70px;height:70px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .t{stroke:rgba(124,58,237,.14)}
.ring .v{stroke:url(#g);transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.rule{margin:16px 0 10px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(124,58,237,.09),rgba(236,72,153,.09));border-left:4px solid var(--k)}
.rule p{margin:0}.rule .th{color:var(--mut);font-size:14px;margin-top:2px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ex div{padding:10px 12px;border-radius:14px;font-size:13.5px}
.ex b{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.ex .g{background:#ecfdf5;border:1px solid #a7f3d0}.ex .g b{color:#047857}
.ex .b{background:#fff1f2;border:1px solid #fecdd3}.ex .b b{color:#be123c}
textarea{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surf);font-size:16px;line-height:1.55;resize:vertical;outline:none;transition:.25s;min-height:80px}
textarea:focus{border-color:var(--p2);box-shadow:0 0 0 5px rgba(168,85,247,.16),0 0 28px -6px rgba(236,72,153,.35)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin:6px 2px 10px}
.meta .btn{padding:4px 12px;font-size:12px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.chk{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:13px;background:var(--surf);border:1px solid var(--line);transition:background .35s,border-color .35s,transform .35s;animation:rise .5s both;animation-delay:calc(var(--i)*55ms)}
.chk .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:#efe8ff;color:transparent;font-size:14px;font-weight:800;transition:.35s}
.chk b{font-weight:600;font-size:14px;display:block}.chk small{color:var(--mut);font-size:12px}
.chk.ok{background:#ecfdf5;border-color:#6ee7b7}
.chk.ok .dot{background:var(--ok);color:#fff}
.chk.pop{animation:okpop .6s cubic-bezier(.2,1.4,.3,1)}
.chk.pop .dot{animation:dotpop .6s}
@keyframes okpop{30%{transform:scale(1.05);box-shadow:0 0 0 8px rgba(16,185,129,.18)}}
@keyframes dotpop{0%{transform:scale(.3) rotate(-90deg)}60%{transform:scale(1.4)}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
/* assemble */
.asm{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.paper{background:#fffdf8;color:#2a1055;border-radius:6px 6px 22px 22px;padding:clamp(18px,3vw,34px);box-shadow:0 30px 60px -24px rgba(124,58,237,.45);position:relative;font-family:Georgia,'Times New Roman','Noto Serif Thai',serif;animation:paper .8s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes paper{from{opacity:0;transform:translateY(60px) rotate(-2deg) scale(.96)}}
.paper::before{content:"";position:absolute;left:50%;top:-12px;width:110px;height:26px;transform:translateX(-50%) rotate(-2deg);background:rgba(244,114,182,.5);border-radius:4px}
.blk{position:relative;padding:8px 0 8px 0;animation:fly .7s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i)*170ms + 300ms)}
@keyframes fly{from{opacity:0;transform:translateX(-60px) scale(.95)}}
.blk .lab{font-family:'Prompt',sans-serif;display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,var(--p),var(--k));padding:2px 9px;border-radius:99px;margin-bottom:4px}
.blk .tx{white-space:pre-wrap;font-size:16px;line-height:1.6}
.blk.hd .tx{font-size:24px;font-weight:700;line-height:1.25}
.blk.sb .tx{font-size:17px;font-style:italic;color:#4b3b6b}
.blk.rl .tx,.blk.dl b{font-weight:700;letter-spacing:.5px}
.blk .empty{color:#b7a8d3;cursor:pointer;font-family:'Prompt',sans-serif;font-size:14px}
.board{position:sticky;top:78px}
.big{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.big .ring{width:104px;height:104px}.big .ring span{font-size:24px}
.cat{margin:9px 0}
.cat .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:3px}
.cat .row b{font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:rgba(124,58,237,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--k));transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
.weak{margin:14px 0;display:grid;gap:6px;font-size:13px}
.weak button{all:unset;cursor:pointer;padding:7px 11px;border-radius:12px;background:#fff7fb;border:1px solid #fbcfe8;transition:.2s}
.weak button:hover{transform:translateX(5px)}
.ok-msg{padding:10px 14px;border-radius:14px;margin-top:12px;font-size:14px;animation:rise .5s both}
.ok-msg.good{background:#ecfdf5;border:1px solid #6ee7b7}.ok-msg.warn{background:#fff7d6;border:1px dashed #e0b400}.ok-msg.err{background:#fff1f2;border:1px solid #fecdd3}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
@media(max-width:959px){.ws,.asm{grid-template-columns:1fr}.fs,.board{position:static;max-height:none}.ex{grid-template-columns:1fr}.fr{grid-template-columns:90px 1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0ms!important}.ltr{opacity:1;transform:none}}
.ws>*,.asm>*,.main{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
.pill.on{background:transparent;border-color:transparent}
.cat .row>span:first-child{flex:1;padding-right:10px}
.cat .row .v{white-space:nowrap}
/* ===== theme toggle + roles ===== */
.tbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px;transition:transform .5s cubic-bezier(.3,1.5,.4,1)}
.tbtn:hover{transform:rotate(25deg) scale(1.08)}
.tbtn.spin{animation:tspin .6s cubic-bezier(.3,1.4,.4,1)}
@keyframes tspin{from{transform:rotate(-180deg) scale(.4)}}
.roles{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:16px;background:rgba(124,58,237,.1);margin:4px 0 14px}
.roles button{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:12px;font-weight:700;position:relative;z-index:1;transition:color .3s}
.roles button.on{color:#fff}
.roles .knob{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:12px;background:linear-gradient(135deg,var(--p),var(--k));box-shadow:0 8px 20px -8px rgba(236,72,153,.8);transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
.roles.t .knob{transform:translateX(100%)}
.tlog{display:grid;gap:10px;text-align:left;animation:rise .4s both}
.tlog label{font-size:13px;color:var(--mut)}
.pw{position:relative}
.pw input{width:100%;padding:14px 48px 14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surf);font-size:16px;outline:none;transition:.25s}
.pw input:focus{border-color:var(--p2);box-shadow:0 0 0 5px rgba(168,85,247,.16)}
.pw button{all:unset;cursor:pointer;position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px}
.terr{color:var(--bad);font-size:13px;min-height:18px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* ===== teacher ===== */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tbar .stepper{flex:1 1 auto;padding:6px 4px 8px}
.upd{font-size:12.5px;color:var(--mut);display:flex;gap:8px;align-items:center}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:ld 1.6s infinite}
@keyframes ld{70%{box-shadow:0 0 0 9px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);animation:rise .5s both;animation-delay:calc(var(--i)*60ms)}
.kpi b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi.k-ok b{color:var(--ok)}.kpi.k-w b{color:var(--p2)}.kpi.k-i b{color:#f59e0b}.kpi.k-n b{color:var(--mut)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1 1 200px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surf);font-size:14px;outline:none}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:rgba(124,58,237,.1)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600}
.seg button.on{background:var(--surf);box-shadow:0 2px 8px -2px rgba(124,58,237,.4);color:var(--p)}

/* ===== CORE: rubric (10 pts), checks, scoring ===== */
const HYPE = ["amazing","incredible","best","ever","unbelievable","revolutionary","must-see","huge","awesome","world-class","perfect","ultimate","exciting","fantastic","biggest","greatest","guaranteed","epic","insane","don't miss","stunning","magical","unforgettable","once-in-a-lifetime","wonderful","dream","super"];
const VERBS = ["launches","opens","expands","bans","introduces","offers","holds","hosts","invites","announces","unveils","rolls","plants","goes","brings","starts","begins","sets","gives","adds","joins","welcomes","rescues","cuts","replaces","awards","creates","debuts","rallies","calls","seeks","aims","marks","returns","unveils","kicks","opens","provides","extends","rolls","lifts","ends","removes","restores","protects","supports","gets","makes","takes","pilots","unlocks"];

const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const HYPE_RE = new RegExp("(^|[^a-z])(" + HYPE.map(esc).join("|") + ")([^a-z]|$)", "i");
const norm = t => (t || "").replace(/[’‘]/g, "'").replace(/[“”]/g, '"');
const words = t => { const w = (t || "").trim().split(/\s+/).filter(Boolean); return w.length; };
const lc = t => norm(t).toLowerCase();
const hasAny = (t, kws) => { const x = lc(t); return kws.some(k => x.includes(k)); };
const numsIn = t => (norm(t).match(/\d[\d,]*(?:\.\d+)?/g) || []).map(x => x.replace(/,/g, "").replace(/\.$/, ""));
const stripQuotes = t => norm(t).replace(/"[^"]*"/g, " ");
const sentences = t => (t.match(/[.!?](\s|$)/g) || []).length || (t.trim() ? 1 : 0);
const quoted = t => { const m = norm(t).match(/"([^"]+)"/); return m ? m[1] : ""; };

function factSets(st) {
  const allowed = new Set(), key = new Set();
  st.facts.forEach(([l, v]) => {
    if (l === "Media contact") return;
    numsIn(v).forEach(n => { allowed.add(n); if (l === "Numbers") key.add(n); });
  });
  allowed.add(String(st.rel.d)); allowed.add(String(st.rel.y));
  return { allowed, key };
}

const SELF_RE = /\b(you|your|we|our|us|my|i)\b/i;
const noHype = t => !HYPE_RE.test(lc(t));
const thirdPerson = t => !SELF_RE.test(stripQuotes(t));

];

const r2 = x => Math.round(x * 100) / 100;

function scorePart(part, text, story) {
  const t = text || "", sets = factSets(story);
  const results = part.checks.map(c => { let ok = false; if (t.trim()) { try { ok = !!c.fn(t, story, sets); } catch (e) { ok = false; } } return { id: c.id, ok }; });
  const pass = results.filter(r => r.ok).length;
  return { id: part.id, pass, total: part.checks.length, max: part.w, pts: r2(part.w * pass / part.checks.length), results, empty: !t.trim() };
}

function scoreAll(story, drafts) {
  const parts = {}, cats = {}; let total = 0;
  CATS.forEach(c => cats[c.id] = 0);
  PARTS.forEach(p => { const s = scorePart(p, drafts[p.id], story); parts[p.id] = s; cats[p.cat] = r2(cats[p.cat] + s.pts); total = r2(total + s.pts); });
  return { parts, cats, total };
}

if (typeof module !== "undefined") module.exports = { PARTS, CATS, HYPE, scorePart, scoreAll, factSets, numsIn, words };

function countUp(el, to, dur = 1000, dec = 2) {

function confetti() {
  const cv = $("#cf"); if (!cv || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#7c3aed", "#ec4899", "#f59e0b", "#10b981", "#38bdf8", "#a855f7"];
  const ps = Array.from({ length: 150 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .55, vx: (Math.random() - .5) * 16, vy: -Math.random() * 17 - 4, s: 5 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
  let n = 0;
  (function f() { x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (++n < 170) requestAnimationFrame(f); else x.clearRect(0, 0, cv.width, cv.height); })();
}

    <div id="ls" class="tlog"><label for="sel">เลือกชื่อของคุณ · Select your name</label><div class="selw"><select id="sel"><option value="" disabled selected>— เลือกชื่อ-สกุล —</option>${ROSTER.map((r, i) => `<option value="${r[0]}">${i + 1}. ${h(r[1])} (${r[0]})</option>`).join("")}</select><i>▾</i></div><button class="btn big" id="sgo" disabled>เข้าสู่บทเรียน →</button>

    <div id="lt" class="tlog" hidden><label for="tc">Teacher code · รหัสอาจารย์</label><div class="pw"><input id="tc" type="password" autocomplete="current-password" placeholder="••••••••"><button id="eye" type="button" aria-label="Show code">👁️</button></div>
    <div class="terr" id="terr"></div><button class="btn big" id="tgo">เข้าสู่ Teacher Dashboard →</button></div>${demoBanner()}</div></section>`;
  gradLetters($("#ttl")); const roles = $("#roles");
  $$("button", roles).forEach(b => b.onclick = () => {
    const t = b.dataset.r === "t"; roles.classList.toggle("t", t);
    $$("button", roles).forEach(x => x.classList.toggle("on", x === b));
    $("#ls").hidden = t; $("#lt").hidden = !t; (t ? $("#tc") : $("#sel")).focus();
  });
  $("#eye").onclick = () => { const i = $("#tc"); i.type = i.type === "password" ? "text" : "password"; };
  const tgo = () => {
    const v = $("#tc").value.trim();
    if (fnv(v) !== T_HASH) { $("#terr").textContent = "รหัสไม่ถูกต้อง · Incorrect code"; const c = $(".hero"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); return; }
    S.role = "t"; S.tcode = v; go("teacher");
  };
  $("#tgo").onclick = tgo; $("#tc").onkeydown = e => { if (e.key === "Enter") tgo(); };
  const sel = $("#sel"), sgo = $("#sgo");
  sel.onchange = () => { sgo.disabled = !sel.value; };
  sgo.onclick = () => { const rec = ROSTER.find(r => r[0] === sel.value); if (rec) start(rec); };
}
function start(rec) {
  S.student = rec; const sv = loadSaved(rec[0]);
  S.drafts = sv ? sv.drafts || {} : {}; S.sub = sv ? sv.sub : null;
  if (sv && sv.sid) { S.sid = sv.sid; S.part = sv.part || 0; go("work"); } else { S.sid = 0; go("pick"); }
}

/* ---------- story picker ---------- */
function pick() {
  app.innerHTML = `<section class="screen"><div class="ph1"><h2 class="gt">สวัสดี ${h(S.student[1].split(" ")[0])} 👋 เลือกเรื่องที่จะเขียน</h2></div>
  <div class="grid">${STORIES.map((s, i) => {
    const d = S.drafts[s.id], n = d ? PARTS.filter(p => (d[p.id] || "").trim()).length : 0;
    return `<button class="story" style="--i:${i}" data-id="${s.id}"><span class="n">${String(s.id).padStart(2, "0")}</span><span class="ic">${s.ic}</span><span class="tag">${h(s.tag)} · ${h(s.tagTh)}</span><h3>${h(s.title)}</h3><p>${h(s.news)}<br><small>${h(s.newsTh)}</small></p>${n ? `<div class="prog">✍️ เขียนแล้ว ${n}/10 ส่วน</div>` : ""}</button>`;
  }).join("")}</div></section>`;
  $$(".story").forEach(c => {
    c.onclick = () => preview(+c.dataset.id);
    c.onpointermove = e => { const b = c.getBoundingClientRect(); c.style.setProperty("--ry", ((e.clientX - b.left) / b.width - .5) * 14 + "deg"); c.style.setProperty("--rx", -((e.clientY - b.top) / b.height - .5) * 14 + "deg"); };
    c.onpointerleave = () => { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); };
  });
}
function factRows(st, startAt = 0) {
  return st.facts.map(([l, v], i) => `<div class="fr ${l === "Extra" ? "extra" : ""} ${l === "Head office" ? "must" : ""}" style="--i:${i + startAt}"><b>${h(l)}</b><span>${h(v)}</span></div>`).join("");
}
function preview(id) {
  const st = STORIES.find(x => x.id === id), ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="card modal"><div style="font-size:44px">${st.ic}</div><h3>${h(st.title)}</h3><p class="sub">${h(st.news)} · ${h(st.newsTh)}</p><div class="facts">${factRows(st)}</div><div class="mact"><button class="btn ghost" id="mc">ยกเลิก</button><button class="btn" id="mo">เริ่มเขียนเรื่องนี้ ✍️</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => { ov.style.opacity = 0; setTimeout(() => ov.remove(), 200); };
  ov.onclick = e => { if (e.target === ov) close(); };
  $("#mc", ov).onclick = close;
  $("#mo", ov).onclick = () => { close(); S.sid = id; S.drafts[id] = S.drafts[id] || {}; S.part = 0; S.sub = null; save(); go("work"); };
}

/* ---------- fact sheet: floating button + popup ---------- */
const PART_FACTS = { rl: ["Release date"], h: ["Organisation", "News"], sub: ["Numbers", "Date/time", "Place"], dl: ["Head office", "Release date"],
  lead: ["Organisation", "News", "Date/time", "Place", "Numbers"], body: ["Numbers", "Date/time", "Place", "Booking", "Info", "Extra"],
  quote: ["Spokesperson", "Organisation"], bp: ["Organisation"], ct: ["Media contact"], end: [] };
function mountFab() {
  let f = $("#fab"); if (f) f.remove();
  f = document.createElement("button"); f.id = "fab"; f.className = "fab"; f.type = "button";
  f.setAttribute("aria-label", "เปิด Fact Sheet");
  f.innerHTML = `<span class="fab-ic">📋</span><span class="fab-tx"><b class="fl">Fact Sheet</b><b class="fs">FACTS</b><small>ข้อมูลที่ใช้เขียน</small></span>`;
  f.onclick = openFacts; document.body.appendChild(f);
}
function closeFacts() { const ov = $("#fsov"); if (!ov) return; ov.classList.add("out"); setTimeout(() => ov.remove(), 260); document.removeEventListener("keydown", factsKey); const ta = $("#ta"); if (ta && !matchMedia("(pointer:coarse)").matches) ta.focus({ preventScroll: true }); }
function factsKey(e) { if (e.key === "Escape") closeFacts(); }
function openFacts() {
  if ($("#fsov")) return;
  const st = story(), pid = S.part < 10 ? PARTS[S.part].id : null, use = pid ? PART_FACTS[pid] : [];
  const ov = document.createElement("div"); ov.className = "ov fsov"; ov.id = "fsov";
  ov.innerHTML = `<div class="card modal sheet" role="dialog" aria-modal="true" aria-labelledby="fsh">
    <div class="sheet-hd"><span class="sic">${st.ic}</span><div><div class="pn">📋 FACT SHEET</div><h3 id="fsh">${h(st.title)}</h3></div><button class="btn ghost sm" id="fsx" aria-label="ปิด">✕ ปิด</button></div>
    ${pid ? `<div class="hint">${use.length ? `✨ ข้อมูลที่ใช้ใน <b>Part ${PARTS[S.part].n} ${PARTS[S.part].en}</b> ถูกไฮไลต์ไว้` : `Part นี้ไม่ต้องใช้ข้อมูลจาก fact sheet`}</div>` : ""}
    <div class="facts">${st.facts.map(([l, v], i) => `<div class="fr ${l === "Extra" ? "extra" : ""} ${use.includes(l) ? "use" : ""}" style="--i:${i}"><b>${h(l)}</b><span>${h(v)}</span></div>`).join("")}</div>
    <p class="note" style="text-align:center">ใช้ข้อมูลตามนี้เท่านั้น · ห้ามแต่งตัวเลขหรือชื่อเพิ่ม</p></div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov) closeFacts(); };
  $("#fsx", ov).onclick = closeFacts; $("#fsx", ov).focus();
  document.addEventListener("keydown", factsKey);
  const first = $(".fr.use", ov); if (first) setTimeout(() => first.scrollIntoView({ block: "nearest", behavior: "smooth" }), 350);
}

/* ---------- workspace ---------- */
const PILLS = [...PARTS.map(p => ({ ic: p.ic, label: p.en })), { ic: "🎬", label: "Assemble" }];
function work() {
  const st = story(); S.drafts[S.sid] = S.drafts[S.sid] || {}; S.prev = {};
  app.innerHTML = `<section class="screen"><div class="ws one">
    <div class="main"><nav class="stepper" id="stp">${PILLS.map((p, i) => `<button class="pill" data-i="${i}">${p.ic} ${i < 10 ? i + 1 + ". " : ""}${p.label}</button>`).join("")}<i class="ind"></i></nav>
    <div class="meter"><b id="mbar"></b></div><div id="pane"></div></div></div></section>`;
  mountFab();
  $$(".pill").forEach(b => b.onclick = () => showPart(+b.dataset.i));
  showPart(S.part, 1, true);
}
function pillStates() {
  const r = scoreAll(story(), S.drafts[S.sid]);
  $$(".pill").forEach((b, i) => {
    b.classList.toggle("on", i === S.part);
    if (i < 10) { const x = r.parts[PARTS[i].id]; b.classList.toggle("done", !x.empty); b.classList.toggle("perfect", x.pass === x.total); }
  });
  $("#mbar").style.width = r.total * 10 + "%"; setScore(r.total); return r;
}
function moveInd() {
  const on = $(".pill.on"), ind = $(".ind"); if (!on) return;
  ind.style.width = on.offsetWidth + "px"; ind.style.transform = `translateX(${on.offsetLeft}px)`;
  on.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}
function showPart(i, dir, first) {
  dir = dir || (i >= S.part ? 1 : -1); S.part = i; S.prev = {}; save();
  pillStates(); requestAnimationFrame(moveInd);
  const pane = $("#pane");
  if (i === 10) { assemble(pane); ping(); return; }
  const p = PARTS[i], st = story(), txt = S.drafts[S.sid][p.id] || "";
  pane.innerHTML = `<div class="card part ${dir < 0 ? "in-l" : ""}">
   <div class="phd"><div class="pic">${p.ic}</div><div><div class="pn">PART ${p.n} / 10 · ${p.w} pts</div><h2><span class="gt disp">${p.en}</span><small>${p.th}</small></h2></div>${ringHTML(0, "0")}</div>
   <div class="rule"><p>${h(p.rule.en)}</p><p class="th">${h(p.rule.th)}</p></div>
   <div class="ex"><div class="g"><b>✓ Example (Blue Klong)</b>${h(p.good)}</div><div class="b"><b>✗ Avoid</b>${h(p.bad)}</div></div>
   <textarea id="ta" rows="${["lead", "body", "quote", "bp"].includes(p.id) ? 5 : 2}" placeholder="${h(p.ph)}" spellcheck="false"></textarea>
   <div class="meta"><span id="wc">0 words</span><button class="btn ghost" id="clr">ล้าง</button></div>
   <ul class="checks">${p.checks.map((c, k) => `<li class="chk" data-id="${c.id}" style="--i:${k}"><span class="dot">✓</span><div><b>${h(c.en)}</b><small>${h(c.th)}</small></div></li>`).join("")}</ul>
   <div class="nav"><button class="btn ghost" id="pv" ${i === 0 ? "disabled" : ""}>◀ Back</button><button class="btn" id="nx">${i === 9 ? "🎬 Assemble" : "Next ▶"}</button></div></div>`;
  const ta = $("#ta"); ta.value = txt;
  ta.onfocus = () => { if (matchMedia("(max-width:640px)").matches) document.body.classList.add("typing"); };
  ta.onblur = () => document.body.classList.remove("typing");
  ta.oninput = () => { S.drafts[S.sid][p.id] = ta.value; save(); live(p, true); };
  $("#clr").onclick = () => { ta.value = ""; ta.oninput(); ta.focus(); };
  $("#pv").onclick = () => showPart(i - 1, -1);
  $("#nx").onclick = () => showPart(i + 1, 1);
  live(p, false); armRings(pane);
  if (!first && !matchMedia("(pointer:coarse)").matches) ta.focus({ preventScroll: true });
}
function live(p, animate) {
  const st = story(), t = S.drafts[S.sid][p.id] || "", r = scorePart(p, t, st);
  $("#wc").textContent = words(t) + " words";
  r.results.forEach(x => {
    const li = $(`.chk[data-id="${x.id}"]`), key = p.id + ":" + x.id, was = S.prev[key];
    li.classList.toggle("ok", x.ok);
    if (animate && x.ok && was === false) { li.classList.remove("pop"); void li.offsetWidth; li.classList.add("pop"); }
    S.prev[key] = x.ok;
  });
  const ring = $(".phd .ring"); ring.dataset.frac = r.pass / r.total; setRing(ring, r.pass / r.total); $("span", ring).textContent = r.pts.toFixed(2);
  pillStates();
}

/* ---------- assemble + submit ---------- */
function fullText(d) { return [d.rl, d.h + "\n" + (d.sub || ""), (d.dl || "") + " " + (d.lead || ""), d.body, d.quote, d.bp, d.ct, d.end].map(x => (x || "").trim()).filter(Boolean).join("\n\n"); }
function assemble(pane) {
  const st = story(), d = S.drafts[S.sid], r = scoreAll(st, d);
  const e = (k, txt) => (txt || "").trim() ? h(txt.trim()) : `<span class="empty" data-j="${k}">— ยังไม่ได้เขียน · คลิกเพื่อไปเขียน —</span>`;
  const blocks = [["rl", "Release line", "rl", 0, e(0, d.rl)], ["h", "Headline", "hd", 1, e(1, d.h)], ["sub", "Subheadline", "sb", 2, e(2, d.sub)],
    ["lead", "Dateline + Lead", "", 4, ((d.dl || "").trim() ? `<b>${h(d.dl.trim())}</b> ` : "") + e(4, d.lead)], ["body", "Body", "", 5, e(5, d.body)],
    ["quote", "Quote", "", 6, e(6, d.quote)], ["bp", "Boilerplate", "", 7, e(7, d.bp)], ["ct", "Media contact", "", 8, e(8, d.ct)], ["end", "End mark", "", 9, e(9, d.end)]];
  const weak = [];
  PARTS.forEach((p, i) => { const x = r.parts[p.id]; if (x.empty) weak.push([i, `Part ${p.n} ${p.en}: ยังไม่ได้เขียน`]); else if (x.pass < x.total) weak.push([i, `Part ${p.n} ${p.en}: ${p.checks.filter((c, k) => !x.results[k].ok).map(c => c.en).join(" · ")}`]); });
  pane.innerHTML = `<div class="asm"><div class="paper">${blocks.map((b, i) => `<div class="blk ${b[2]}" style="--i:${i}"><span class="lab">${b[1]}</span><div class="tx">${b[4]}</div></div>`).join("")}</div>
   <aside class="card board"><div class="big">${ringHTML(r.total / 10, "0.00")}<div><div class="pn">YOUR SCORE · คะแนนของคุณ</div><h2 style="margin:0">${st.ic} ${h(st.title)}</h2><button class="btn ghost" id="cp" style="margin-top:8px;padding:5px 12px;font-size:12px">📋 Copy release</button></div></div>
   ${CATS.map((c, i) => `<div class="cat"><div class="row"><span>${c.en}<br><small style="color:var(--mut)">${c.th}</small></span><span class="v"><b data-c="${i}">0.00</b>/${c.max.toFixed(2)}</span></div><div class="bar"><i data-w="${r.cats[c.id] / c.max * 100}"></i></div></div>`).join("")}
   <div class="weak">${weak.length ? `<b>จุดที่ยังปรับได้ · Improve</b>` + weak.map(w => `<button data-j="${w[0]}">${h(w[1])}</button>`).join("") : `<div class="ok-msg good">🎉 ครบทุกเกณฑ์ · Perfect!</div>`}</div>
   <button class="btn big" id="sb">🚀 ส่งคะแนนให้อาจารย์</button><div id="ss">${S.sub ? subMsg() : ""}</div>${demoBanner()}</aside></div>`;
  armRings(pane);
  const tr = $(".big .ring span", pane); setTimeout(() => countUp(tr, r.total, 1200), 350);
  $$(".cat b", pane).forEach((b, i) => setTimeout(() => countUp(b, r.cats[CATS[i].id], 900), 350 + i * 90));
  setTimeout(() => $$(".bar i", pane).forEach(i => i.style.width = i.dataset.w + "%"), 400);
  $$("[data-j]", pane).forEach(b => b.onclick = () => showPart(+b.dataset.j, -1));
  $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(fullText(d)); $("#cp").textContent = "✓ Copied"; } catch (x) { $("#cp").textContent = "คัดลอกไม่ได้"; } };
  $("#sb").onclick = () => submit(r);
}
const subMsg = () => `<div class="ok-msg good">✅ ส่งแล้ว · ${S.sub.total.toFixed(2)}/10${S.sub.attempt ? " · ครั้งที่ " + S.sub.attempt : ""}${S.sub.demo ? "<br><small>(โหมดทดสอบ: บันทึกในเครื่องนี้เท่านั้น)</small>" : ""}<br><small>แก้แล้วส่งใหม่ได้ ระบบนับครั้งที่ดีที่สุดให้</small></div>`;
async function submit(r) {
  const st = story(), d = S.drafts[S.sid], btn = $("#sb"), out = $("#ss");
  const empties = PARTS.filter(p => r.parts[p.id].empty).length;
  if (empties && !confirm(`ยังไม่ได้เขียน ${empties} ส่วน ต้องการส่งเลยไหม?`)) return;
  btn.disabled = true; btn.textContent = "⏳ กำลังส่ง…";
  const payload = { action: "submit", id: S.student[0], name: S.student[1], storyId: st.id, storyTitle: st.title,
    scores: Object.assign({}, r.cats, { total: r.total }), parts: Object.fromEntries(PARTS.map(p => [p.id, r.parts[p.id].pts])),
    fails: PARTS.flatMap(p => r.parts[p.id].results.filter(x => !x.ok).map(x => p.id + "." + x.id)), texts: d, ts: new Date().toISOString() };
  const res = await send(payload);
  btn.disabled = false; btn.textContent = "🚀 ส่งใหม่อีกครั้ง";
  if (res.ok || res.demo) {
    const tot = typeof res.total === "number" ? res.total : r.total;
    S.sub = { total: tot, attempt: res.attempt || null, demo: !!res.demo, ts: payload.ts }; save();
    out.innerHTML = subMsg(); if (tot >= 8) confetti();
  } else out.innerHTML = `<div class="ok-msg err">❌ ส่งไม่สำเร็จ ลองอีกครั้ง (งานของคุณยังไม่หาย)<br><small>${h(res.error || res.msg || "")}</small></div>`;
  ping();
}

/* ---------- boot ---------- */
window.addEventListener("resize", () => { if (S.screen === "work") moveInd(); });
sparks(); setTop(); login();

</script>
